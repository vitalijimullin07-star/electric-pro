<!doctype html><html lang="ru"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"><meta name="theme-color" content="#0f172a">
<title>Electric Pro Clean</title>
<link rel="stylesheet" href="assets/css/styles.css?v=v1.0.2-remember-login"><link rel="stylesheet" href="assets/css/database.css?v=v1.0.2-remember-login"><link rel="stylesheet" href="assets/css/shield.css?v=v1.0.2-remember-login"><link rel="stylesheet" href="assets/css/pool.css?v=v1.0.2-remember-login"><link rel="stylesheet" href="assets/css/scheme.css?v=v1.0.2-remember-login">
<script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js?v=v1.0.2-remember-login"></script><script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js?v=v1.0.2-remember-login"></script><script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js?v=v1.0.2-remember-login"></script>
<script defer src="config/firebase-config.js?v=v1.0.2-remember-login"></script>
<script defer src="assets/js/diagnostics.js?v=v1.0.2-remember-login"></script><script defer src="assets/js/visual-settings.js?v=v1.0.2-remember-login"></script><script defer src="assets/js/crypto-api.js?v=v1.0.2-remember-login"></script><script defer src="assets/js/cache-api.js?v=v1.0.2-remember-login"></script><script defer src="assets/js/change-log-api.js?v=v1.0.2-remember-login"></script><script defer src="assets/js/server-api.js?v=v1.0.2-remember-login"></script><script defer src="assets/js/sync-api.js?v=v1.0.2-remember-login"></script><script defer src="assets/js/database-api.js?v=v1.0.2-remember-login"></script><script defer src="assets/js/estimate-api.js?v=v1.0.2-remember-login"></script><script defer src="assets/js/auth.js?v=v1.0.2-remember-login"></script><script defer src="assets/js/router.js?v=v1.0.2-remember-login"></script><script defer src="assets/js/app-shell.js?v=v1.0.2-remember-login"></script>
</head><body><div id="appBg" class="app-bg"></div>
<section id="loginScreen" class="login-screen"><div class="login-card glass"><div class="brand-mark">⚡</div><h1>Electric Pro</h1><p>Рабочее приложение электрика</p><button id="googleLoginBtn" class="btn btn-primary btn-wide"><span>G</span> Войти через Google</button><button id="demoLoginBtn" class="btn btn-ghost btn-wide">Режим проверки визуала</button><div class="mini-note">PIN-вход удалён. Рабочий вход будет только через Google/Firebase.</div></div></section>
<div id="appShell" class="app-shell hidden"><header class="topbar glass"><button id="burgerBtn" class="icon-btn burger-btn" aria-label="Открыть меню"><span></span><span></span><span></span></button><div class="topbar-title"><strong id="masterSpeciality">Электрик</strong><span id="masterName">Мастер</span></div><button id="firebaseStatusBtn" class="status-btn" aria-label="Статус Firebase"><span id="firebaseDot" class="status-dot status-wait"></span></button></header>
<aside id="sideMenu" class="side-menu glass"><div class="side-head"><div class="avatar">⚡</div><div><strong id="sideMasterName">Мастер</strong><span id="sideMasterRole">visual-start</span></div></div><nav class="side-nav"><button data-route="customer">👤 О заказчике</button><button data-route="ai">🤖 ИИ функции</button><button data-route="database">🗂️ База данных</button><button data-route="scheme">📈 Однолинейка и визуализация щита</button><button data-route="documents">📄 Документы</button><button data-route="accounting">💰 Бухгалтерия</button><button data-route="warehouse">📦 Склад</button><button data-route="drafts">📝 Черновики</button><button data-route="visual">🎨 Настройка визуала</button><button data-route="settings">⚙️ Настройки</button><button data-route="guide">📚 Гайд / новые функции</button></nav><button id="logoutBtn" class="btn btn-danger btn-wide">Выйти</button></aside><div id="menuOverlay" class="menu-overlay"></div><main id="pageContainer" class="page-container"></main></div>
<section id="diagnosticsModal" class="modal hidden"><div class="modal-card glass"><div class="modal-head"><h2>Диагностика</h2><button id="closeDiagnosticsBtn" class="icon-btn">×</button></div><pre id="diagnosticsText" class="diagnostics-box"></pre><div class="modal-actions"><button id="copyDiagnosticsBtn" class="btn btn-primary">Скопировать ошибку / статус</button><button id="clearDiagnosticsBtn" class="btn btn-ghost">Очистить</button></div></div></section>
<section id="visualPanel" class="modal hidden"><div class="modal-card glass visual-card"><div class="modal-head"><h2>Настройка визуала</h2><button id="closeVisualBtn" class="icon-btn">×</button></div><div class="theme-grid" id="themeGrid"></div><div class="settings-grid"><label>Акцентный цвет<input id="accentColorInput" type="color"></label><label>Прозрачность карточек<input id="glassOpacityInput" type="range" min="0.35" max="0.92" step="0.01"></label><label>Скругление<input id="radiusInput" type="range" min="10" max="34" step="1"></label><label>Размытие стекла<input id="blurInput" type="range" min="4" max="26" step="1"></label><label>Плотность интерфейса<select id="densityInput"><option value="compact">Компактно</option><option value="normal">Обычно</option><option value="large">Крупнее</option></select></label></div><button id="resetVisualBtn" class="btn btn-ghost btn-wide">Сбросить визуал</button></div></section>
</body></html>
