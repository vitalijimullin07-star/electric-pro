name: Проверки и сборка

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: plata-dist
          path: dist
      # Сайт на GitHub Pages публикуется из корня ветки main: собранный index.html должен быть закоммичен.
      - name: Собранный index.html совпадает с исходниками
        run: git diff --exit-code --stat -- index.html 'router.worker-*.js' || (echo 'Запустите npm run build и закоммитьте index.html' && exit 1)
