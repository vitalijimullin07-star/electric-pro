<section class="page admin-page">
  <div class="page-head">
    <h1>Админ-панель</h1>
    <p>Пользователи, права доступа, личные базы, ИИ-баланс, подписки и безопасность.</p>
  </div>

  <div class="card admin-users-card">
    <div class="admin-head-row">
      <div>
        <h3>Пользователи</h3>
        <p>Нажми на пользователя, чтобы открыть полную карточку.</p>
      </div>
      <button id="refreshUsersBtn" class="btn btn-primary ep-clickable">Обновить</button>
    </div>

    <div id="adminUsersList" class="admin-users-list">
      <div class="admin-empty">Загрузка пользователей...</div>
    </div>
  </div>

  <div id="adminUserModal" class="admin-modal hidden">
    <div class="admin-modal-backdrop" data-admin-close="1"></div>
    <div class="admin-modal-card">
      <div class="admin-modal-head">
        <div>
          <h2 id="adminUserTitle">Карточка пользователя</h2>
          <p id="adminUserSubtitle">Профиль, база, подписка, баланс и безопасность</p>
        </div>
        <button class="admin-modal-close ep-clickable" data-admin-close="1">×</button>
      </div>
      <div id="adminUserDetails" class="admin-user-details">
        <div class="admin-empty">Загрузка карточки...</div>
      </div>
    </div>
  </div>
</section>
